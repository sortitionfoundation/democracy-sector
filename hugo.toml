# ABOUTME: Hugo configuration for the UK Deliberative Standards site
# ABOUTME: Uses a custom GOV.UK-styled theme with Sortition Foundation branding

baseURL = '/'
languageCode = 'en-gb'
title = 'UK Deliberative Standards'
theme = 'govuk-sortition'

[params]
description = 'Standards for deliberative engagement for decision-making, from the UK deliberative democracy sector'
supportEmail = 'info@sortitionfoundation.org'
githubURL = 'https://github.com/sortitionfoundation/democracy-sector'
