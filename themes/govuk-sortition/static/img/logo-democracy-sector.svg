<?xml version="1.0" encoding="UTF-8"?>
<!-- ABOUTME: Placeholder logo for the UK Democracy Sector site -->
<!-- ABOUTME: A simple ballot-box mark beside the words "Democracy Sector" in the site teal -->
<svg xmlns="http://www.w3.org/2000/svg" width="330" height="64" viewBox="0 0 330 64" role="img" aria-labelledby="title">
  <title id="title">UK Democracy Sector</title>
  <!-- Ballot box mark -->
  <rect x="2" y="2" width="60" height="60" rx="6" fill="#00746b"/>
  <rect x="24" y="10" width="16" height="22" rx="1" fill="#ffffff" transform="rotate(-12 32 21)"/>
  <rect x="12" y="28" width="40" height="26" rx="2" fill="#ffffff"/>
  <rect x="22" y="33" width="20" height="3" rx="1.5" fill="#00746b"/>
  <!-- Wordmark -->
  <text x="76" y="28" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#473d3d">UK</text>
  <text x="75" y="54" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0b0c0c">Democracy <tspan fill="#00746b">Sector</tspan></text>
</svg>
