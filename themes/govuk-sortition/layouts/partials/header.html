{{/* ABOUTME: Site header with UK Deliberative Democracy Sector placeholder logo and search */}}
{{/* ABOUTME: White header with logo, search box, and teal accent bar below */}}
<header class="govuk-header" role="banner" data-module="govuk-header">
  <div class="govuk-header__container govuk-width-container">
    <div class="govuk-header__logo">
      <a href="{{ "/" | relURL }}" class="header-logo-link">
        <img src="{{ "img/logo-democracy-sector.svg" | relURL }}"
             alt="UK Deliberative Democracy Sector"
             class="header-logo" />
      </a>
    </div>
    <div class="header-search">
      <div id="search"></div>
    </div>
  </div>
</header>
<div class="header-accent-bar">
  <div class="govuk-width-container">
    <hr class="header-accent-bar__line" />
  </div>
</div>
